[project]
name = "relay"
version = "0.1.0"
description = "Private dashboard for agent sessions in the Work 1 and Work 2 containers"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "playwright==1.63.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
]

[project.scripts]
relay = "relay.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: needs the real podman containers (deselect with -m 'not live')",
]
